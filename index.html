<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EMON MART | Premium E-Commerce</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --primary: #00ff88;
      --secondary: #0ea5e9;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body { background-color: var(--bg-main); color: var(--text-light); overflow-x: hidden; }

    /* ================= NAVBAR ================= */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      position: fixed; top: 0; width: 100%; z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 15px 5%;
      display: flex; justify-content: space-between; align-items: center;
    }

    .logo { font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .logo span { color: var(--primary); }
    .logo i { font-size: 1.8rem; color: var(--secondary); }

    .nav-icons { display: flex; gap: 20px; align-items: center; }
    .icon-btn { 
      background: transparent; border: none; color: #fff; font-size: 1.3rem; 
      cursor: pointer; position: relative; transition: 0.3s; 
    }
    .icon-btn:hover { color: var(--primary); transform: scale(1.1); }
    .badge {
      position: absolute; top: -5px; right: -8px; background: var(--secondary);
      color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 50%;
    }

    /* ================= ADVERTISEMENT BANNER ================= */
    .ad-banner {
      margin-top: 80px; width: 100%; height: 250px;
      background: linear-gradient(45deg, #0f172a, #1e293b), url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=2070') center/cover;
      background-blend-mode: overlay;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px; border-bottom: 2px solid var(--primary);
    }
    .ad-banner h1 { font-size: 2.2rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 15px rgba(0,255,136,0.4); }
    .ad-banner p { font-size: 1rem; color: #cbd5e1; max-width: 600px; }

    /* ================= PRODUCTS GRID ================= */
    .section-title { padding: 30px 5% 10px; font-size: 1.5rem; font-weight: 600; border-left: 4px solid var(--primary); margin: 20px 5%; background: rgba(255,255,255,0.02); }

    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px; padding: 20px 5%;
    }

    .product-card {
      background: var(--bg-card); border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
      display: flex; flex-direction: column;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-color: rgba(0,255,136,0.3); }

    .product-img { width: 100%; height: 200px; object-fit: cover; background: #334155; }
    .product-info { padding: 15px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .product-title { font-size: 1.1rem; font-weight: 600; }
    .product-price { font-size: 1.2rem; color: var(--primary); font-weight: 700; }
    
    .add-to-cart {
      margin-top: auto; width: 100%; padding: 10px; background: linear-gradient(135deg, var(--primary), #059669);
      color: #000; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem;
      cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .add-to-cart:hover { filter: brightness(1.1); }

    /* ================= SLIDING CART ================= */
    .cart-sidebar {
      position: fixed; top: 0; right: -100%; width: 350px; max-width: 100%; height: 100vh;
      background: #111827; border-left: 1px solid rgba(255,255,255,0.1);
      z-index: 2000; transition: 0.4s ease; display: flex; flex-direction: column;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }
    .cart-sidebar.open { right: 0; }
    
    .cart-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .cart-header h2 { color: var(--primary); font-size: 1.2rem; }
    .close-cart { background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    .cart-items { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px; border-radius: 8px; }
    .cart-item-info h4 { font-size: 0.9rem; }
    .cart-item-info p { color: var(--primary); font-weight: bold; font-size: 0.85rem; }
    .remove-item { color: #ef4444; background: transparent; border: none; cursor: pointer; font-size: 1.1rem; }

    .cart-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f172a; }
    .total-price { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
    .checkout-btn { width: 100%; padding: 12px; background: var(--secondary); color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; }

    /* ================= PROFILE / LOGIN MODAL ================= */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      z-index: 3000; display: none; justify-content: center; align-items: center;
    }
    .modal-box {
      background: var(--bg-card); width: 90%; max-width: 400px; padding: 30px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center;
      position: relative;
    }
    .close-modal { position: absolute; top: 15px; right: 15px; color: #fff; background: transparent; border: none; font-size: 1.2rem; cursor: pointer; }
    
    .profile-avatar { width: 80px; height: 80px; background: var(--secondary); border-radius: 50%; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; color: #fff; border: 3px solid var(--primary); }
    
    .modal-box h3 { margin-bottom: 20px; font-size: 1.3rem; }
    
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px; outline: none; }
    .input-group input:focus { border-color: var(--primary); }

    .auth-btn { width: 100%; padding: 12px; background: var(--primary); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    
    .google-btn { width: 100%; padding: 10px; background: #fff; color: #000; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .google-btn img { width: 20px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-store"></i> EMON <span>MART</span>
    </div>
    <div class="nav-icons">
      <button class="icon-btn" onclick="toggleProfile()"><i class="fa-regular fa-user"></i></button>
      <button class="icon-btn" onclick="toggleCart()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- ADS / HERO BANNER -->
  <div class="ad-banner">
    <h1>Special Winter Sale!</h1>
    <p>Premium Gadgets & Accessories at the best price. Powered by Emon Khan. Get flat 50% discount on your first purchase.</p>
  </div>

  <!-- PRODUCTS SECTION -->
  <div class="section-title">Exclusive Products</div>
  <div class="product-grid" id="productGrid">
    <!-- Products injected by JS -->
  </div>

  <!-- SLIDING CART -->
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2><i class="fa-solid fa-cart-shopping"></i> Your Cart</h2>
      <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="cart-items" id="cartItems">
      <p style="text-align:center; color:var(--text-muted); margin-top: 20px;">Cart is empty</p>
    </div>
    <div class="cart-footer">
      <div class="total-price">
        <span>Total:</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- PROFILE / LOGIN MODAL -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-box">
      <button class="close-modal" onclick="toggleProfile()"><i class="fa-solid fa-xmark"></i></button>
      <div class="profile-avatar"><i class="fa-solid fa-user-astronaut"></i></div>
      <h3>Welcome to Emon Mart</h3>
      
      <div class="input-group">
        <label>Email / Gmail</label>
        <input type="email" placeholder="example@gmail.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••">
      </div>
      
      <button class="auth-btn" onclick="alert('Login Successful! Welcome back.')">Log In</button>
      
      <div style="margin: 10px 0; color: var(--text-muted); font-size: 0.9rem;">OR</div>
      
      <button class="google-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
        Login with Google
      </button>
    </div>
  </div>

  <script>
    // Product Database
    const products = [
      { id: 1, name: "Cyberpunk Smartwatch", price: 120.00, img: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500" },
      { id: 2, name: "Wireless ANC Headphones", price: 85.50, img: "https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?w=500" },
      { id: 3, name: "Neon Gaming Keyboard", price: 65.00, img: "https://images.unsplash.com/photo-1595225476474-87563907a212?w=500" },
      { id: 4, name: "Pro Vision Drone 4K", price: 299.99, img: "https://images.unsplash.com/photo-1579829366248-204fe8413f31?w=500" },
      { id: 5, name: "Smart Home Speaker", price: 45.00, img: "https://images.unsplash.com/photo-1589003077984-894e133dabab?w=500" },
      { id: 6, name: "Ultra HD Action Camera", price: 150.00, img: "https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=500" }
    ];

    let cart = [];

    // Render Products
    const productGrid = document.getElementById('productGrid');
    products.forEach(p => {
      productGrid.innerHTML += `
        <div class="product-card">
          <img src="${p.img}" alt="${p.name}" class="product-img">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-price">$${p.price.toFixed(2)}</div>
            <button class="add-to-cart" onclick="addToCart(${p.id})">
              <i class="fa-solid fa-cart-plus"></i> Add to Cart
            </button>
          </div>
        </div>
      `;
    });

    // Cart Logic
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCartUI();
      
      // Visual feedback
      toggleCart(true); 
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      const cartCount = document.getElementById('cartCount');
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');

      cartCount.innerText = cart.length;

      if(cart.length === 0) {
        cartItems.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top: 20px;">Cart is empty</p>`;
        cartTotal.innerText = `$0.00`;
        return;
      }

      let total = 0;
      cartItems.innerHTML = '';
      cart.forEach((item, index) => {
        total += item.price;
        cartItems.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>$${item.price.toFixed(2)}</p>
            </div>
            <button class="remove-item" onclick="removeFromCart(${index})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      });
      cartTotal.innerText = `$${total.toFixed(2)}`;
    }

    function toggleCart(forceOpen = false) {
      const sidebar = document.getElementById('cartSidebar');
      if(forceOpen) {
        sidebar.classList.add('open');
      } else {
        sidebar.classList.toggle('open');
      }
    }

    function toggleProfile() {
      const modal = document.getElementById('profileModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function checkout() {
      if(cart.length === 0) {
        alert("Your cart is empty!");
      } else {
        alert("Order placed successfully via Emon Mart!");
        cart = [];
        updateCartUI();
        toggleCart();
      }
    }

    // Close modal if clicked outside
    window.onclick = function(event) {
      const modal = document.getElementById('profileModal');
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
