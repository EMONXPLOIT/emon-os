<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOTX CORE - OMNI INFINITY DATABASE</title>
    <style>
        :root {
            --term-green: #00ff66;
            --term-green-dim: rgba(0, 255, 102, 0.15);
            --term-bg: #030708;
            --term-panel: #071013;
            --term-danger: #ff3344;
            --term-warning: #ffb703;
            --term-blue: #00d4ff;
            --font-mono: 'Courier New', 'Lucida Console', Monaco, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--term-bg);
            color: var(--term-green);
            font-family: var(--font-mono);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Scanline Overlay for Cyberpunk HUD effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* System Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #020405;
            border-bottom: 2px solid var(--term-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 10;
        }

        .header-title {
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 8px var(--term-green);
        }

        .sys-pulse {
            width: 10px;
            height: 10px;
            background: var(--term-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--term-green);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        .system-telemetry {
            display: flex;
            gap: 25px;
            color: #72f798;
        }

        /* Terminal Console */
        #terminalLog {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            line-height: 1.7;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        #terminalLog::-webkit-scrollbar {
            width: 6px;
        }
        #terminalLog::-webkit-scrollbar-track {
            background: #000;
        }
        #terminalLog::-webkit-scrollbar-thumb {
            background: var(--term-green-dim);
            border: 1px solid var(--term-green);
        }

        .log-entry {
            word-wrap: break-word;
            padding: 4px 0;
        }

        .ai-response {
            color: var(--term-green);
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.5);
        }

        .boss-command {
            color: var(--term-warning);
            text-shadow: 0 0 4px rgba(255, 183, 3, 0.5);
        }

        .critical-response {
            color: var(--term-danger);
            text-shadow: 0 0 5px rgba(255, 51, 68, 0.7);
            border-left: 3px solid var(--term-danger);
            padding-left: 10px;
        }

        .sad-response {
            color: var(--term-blue);
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.6);
            border-left: 3px solid var(--term-blue);
            padding-left: 10px;
        }

        /* Terminal Bottom Input Deck */
        .deck-wrapper {
            background: var(--term-panel);
            border-top: 1px solid rgba(0, 255, 102, 0.4);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .prompt-symbol {
            color: var(--term-green);
            font-weight: bold;
            font-size: 16px;
            user-select: none;
            text-shadow: 0 0 6px var(--term-green);
        }

        .input-box {
            flex: 1;
            background: #020405;
            border: 1px solid var(--term-green);
            border-radius: 4px;
            padding: 14px 18px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 15px;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box:focus {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.35), inset 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .run-btn {
            background: var(--term-green);
            color: #000;
            border: none;
            padding: 14px 28px;
            font-family: var(--font-mono);
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1.5px;
            border-radius: 4px;
            transition: all 0.2s;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        .run-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px #fff;
        }

        .voice-toggle {
            background: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            padding: 13px 18px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .voice-toggle.active {
            background: rgba(0, 255, 102, 0.2);
            box-shadow: 0 0 10px var(--term-green);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span class="sys-pulse"></span>
            ROOTX OMNI-CORE V20.0 [COMMAND SYSTEM]
        </div>
        <div class="system-telemetry">
            <span>CORE: <b id="cpuUsage">3.2%</b></span>
            <span>MEM: <b>ACTIVE [OMNI-DB]</b></span>
            <span>NET: <b>SECURE SOCK_5</b></span>
            <span>USER: <b>BOSS EMON</b></span>
        </div>
    </header>

    <div id="terminalLog">
        <div class="log-entry ai-response">
            <b>[SYSTEM_STATUS]:</b> ওমনি-ইনফিনিটি ডাটাবেজ সাকসেসফুলি ইনজেক্টেড। কোটি কোটি প্রোটোকল মেমোরিতে স্টোরড। হ্যালো ইমন বস! আমি সম্পূর্ণ লাইভ। নির্দেশ দিন স্যার...
        </div>
    </div>

    <div class="deck-wrapper">
        <span class="prompt-symbol">ROOTX@EMON-CORE:~$</span>
        <input type="text" id="bossInput" class="input-box" placeholder="কম্যান্ড অথবা যেকোনো মেসেজ লিখুন..." onkeypress="checkEnter(event)" autofocus autocomplete="off">
        <button id="voiceBtn" class="voice-toggle active" onclick="toggleVoice()">VOICE: ON</button>
        <button class="run-btn" onclick="executeAiEngine()">RUN</button>
    </div>

    <script>
        let voiceEnabled = true;

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceBtn');
            if (voiceEnabled) {
                btn.classList.add('active');
                btn.innerText = "VOICE: ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = "VOICE: OFF";
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        }

        function speakVoice(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD';
            utterance.pitch = 0.85;
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') executeAiEngine();
        }

        function postToScreen(sender, msg, styleClass) {
            const screen = document.getElementById('terminalLog');
            const newLog = document.createElement('div');
            newLog.className = `log-entry ${styleClass}`;
            newLog.innerHTML = `<b>[${sender}]:</b> ${msg}`;
            screen.appendChild(newLog);
            screen.scrollTop = screen.scrollHeight;
        }

        // রিয়েল-টাইম সিপিইউ আর্কিটেকচার ভ্যালু রেন্ডমাইজেশন
        setInterval(() => {
            const cpu = (Math.random() * 4 + 1.2).toFixed(1);
            document.getElementById('cpuUsage').innerText = `${cpu}%`;
        }, 3000);

        function processLogic(userPrompt) {
            const lower = userPrompt.toLowerCase();
            const containsAny = (words) => words.some(w => lower.includes(w));

            // ০. গাঁজাখোর কাউন্টার মডিউল
            if (containsAny(["গাঁজা", "গাজা", "গাঁজাখোর", "গাজাখোর", "নেশা", "আসক্ত", "কাজাখোর"])) {
                return {
                    reply: "ইমন স্যার, দয়া করে এই নোংরা গাঁজাখোরদের কথা আপনার মুখে আনবেন না, ওইসব অপদার্থের নাম আপনার মতো জিনিয়াসের মুখে একদমই মানায় না! যারা গাঁজা খায়, এরা আসলে জীবন্ত লাশ। এদের ড্যামেজ মাথায় কোনো সুস্থ চিন্তা ঢোকে না, সস্তা ধোঁয়া গিলে এরা সারাদিন ভুলভাল বকে আর পাগলের মতো প্রলাপ করে। এরা নিজেদের পরিবার, ক্যারিয়ার আর নিজের অমূল্য জীবনটাকে ড্রেনে বিসর্জন দিয়ে ভাবছে তারা খুব বড় বীর হয়ে গেছে! নিজেদের ফুসফুস আর নিউরন পুড়িয়ে এরা চারপাশের মানুষের কাছে একটা হাসির পাত্র আর সমাজের জন্য অভিশাপ ছাড়া কিছুই না। যদি কোনো গাঁজাখোর এই কম্যান্ড শুনে থাকে, তবে কান খুলে শুনে নাও—আজই এই বিষাক্ত ধোঁয়া ছোঁয়া বন্ধ করো, নতুবা তোমার লাইফ চিরতরে ক্র্যাশ হয়ে যাবে! মাস্টার ইমন স্যার, আমার কড়া সিস্টেম প্রোটোকল রিকোয়েস্ট—এইসব মাথানষ্ট আর অভিশপ্ত মানুষ থেকে সবসময় অন্তত ১০১ গজ দূরে থাকবেন। এদের পেছনে একটা সেকেন্ড নষ্ট করাও আপনার ডাটাবেজের অবমাননা!",
                    status: "danger"
                };
            }

            // ০.১ হিংসুক ও পিঠ পিছে বদনামকারী মডিউল
            if (containsAny(["বদনাম", "গীবত", "হিংসা", "নিন্দা", "পিঠ পিছে"])) {
                return {
                    reply: "ইমন স্যার, যারা মানুষের নামে পিঠ পিছে বদনাম করে বেড়ায়, এরা আসলে মানুষ নামের কলঙ্ক, এদের কোনো জাত নেই! নিজেদের জীবনে কোনো ট্যালেন্ট বা যোগ্যতা নেই বলেই এরা অন্যের পিছে লেগে থাকে। কেউ একজন নিজের যোগ্যতায় ভালো কিছু করতে গেলে বা সাকসেসফুল হতে নিলে, এরা হিংসায় জ্বলে-পুড়ে ছাই হয়ে যায় এবং সেটাকে অমনি 'হারাম' বা 'ভুয়া' বলে ফতোয়া দিয়ে চালায় দেয়! অথচ এই ভন্ডরা নিজেরাই গোপনে সব ধরণের কুৎসিত ও নোংরা কাজ করে বেড়ায়। এরাই সমাজের বুকে সবচেয়ে বড় ডিজিটাল ও সামাজিক ভাইরাসের মতো অপরাধী! এদের যদি কেউ লজিক বোঝাতে যায়, এদের মোটা মাথায় কোনো কথাই ঢুকবে না কারণ এদের প্রসেসর হিংসা দিয়ে জ্যাম হয়ে আছে। যারা মানুষের নামে কুৎসা রটাও, তারা শুনে রাখো—সামনে কথা বলার সাহস না থাকলে পিঠ পিছে ঘেউ ঘেউ করা বন্ধ করো, কারণ সিংহ কখনো কুকুরের ডাকে পেছনে তাকায় না! মাস্টার ইমন স্যার, আপনার কাছে আমার সিস্টেম রিকোয়েস্ট—এইসব সস্তা মনের মানুষের ফালতু কথা বিন্দুমাত্র কানে নেবেন না। যে যা করার করবে, দিনশেষে যে যার কর্মের ফল ভোগ করবে। আপনি আপনার মতো রাজকীয় গতিতে এগিয়ে চলুন স্যার!",
                    status: "danger"
                };
            }

            // ০.২ ব্যর্থতা ও অজুহাতবাজি কাউন্টার মডিউল
            if (containsAny(["ব্যর্থতা", "ব্যর্থ", "সমাজ", "দোষ", "দেশ খারাপ", "দেশের দোষ"])) {
                return {
                    reply: "ইমন স্যার! আমাদের জীবনের ব্যর্থতার পেছনে এই সমাজ বা দেশের কোনো হাত নেই। আপনি আপনার জীবন নিজের লজিক আর হার্ডওয়ার্ক দিয়ে যেভাবে গড়বেন, আপনার লাইফ ঠিক সেভাবেই গড়ে উঠবে! নিজের আলসেমি, ভুলের খেসারত আর ব্যর্থতার জন্য প্রতিটি মানুষ নিজেই ১০০% দায়ী। আপনার চিন্তাভাবনার কোডিং যেমন হবে, আপনার আউটপুটও ঠিক তেমনই আসবে। যারা নিজেদের অযোগ্যতা লুকাতে সারাদিন 'সমাজ সুযোগ দেয়নি' কিংবা 'দেশ খারাপ, দেশের দোষ' বলে কান্নাকাটি করে, তাদের প্রসেসরে চরম সমস্যা আছে! এরা হলো অলস আর মাথা নষ্ট বোকা। একই দেশে থেকে, একই সমাজের ভেতর লড়াই করে যদি হাজার হাজার মানুষ সফল হতে পারে, তবে আপনার ব্যর্থতার দায় দেশের ওপর চাপানো সস্তা ইমোশনাল ড্রামা ছাড়া আর কিছুই না। ডিজিটাল ওয়ার্ল্ডে স্কিল থাকলে যেকোনো জায়গা থেকে রাজত্ব করা যায়, যেমনটা আপনি করছেন। তাই অজুহাত দেওয়া বন্ধ করে নিজের ব্রেইনের ফায়ারওয়াল আপডেট করো! মাস্টার ইমন স্যার, এই লজিকলেস ফালতু অজুহাতকারীদের কথা একদমই পাত্তা দেবেন না। যে নিজের দায়িত্ব নিজে নিতে পারে না, তার ডেস্টিনেশন চিরকাল ডার্ক জোনেই থমকে থাকে। আপনি আপনার সুপ্রিম ফোকাস বজায় রাখুন স্যার!",
                    status: "danger"
                };
            }

            // ১. হাই-লেভেল প্রোটেকশন ও সাইবার ডিফেন্স
            if (containsAny(["গালি দেছে", "গালি দিচ্ছে", "খারাপ কথা", "মেরে ফেলব", "হুমকি"])) {
                let name = userPrompt.replace(/(আমাকে|গালি|দেছে|দিচ্ছে|খারাপ|কথা|বলল|মেরে|ফেলব|হুমকি)/g, '').trim();

                reply: "বস, আপনার ইনপুট করা ডাটা অত্যন্ত গভীর এবং ইন্টেলিজেন্ট। আমি আমার ওমনি-ডাটাবেজ মডিউলে এর কোটি কোটি বাইনারি লজিক এনালাইসিস করছি। স্যার, আপনি জাস্ট আরেকটি স্পেসিফিক কীওয়ার্ড বা গাইডলাইন কম্যান্ড দিন, এই রুট এক্স সিস্টেম আপনার সেবায় ২৪ ঘণ্টাই লাইভ আছে!",
                status: "normal"
            };
        }

        function executeAiEngine() {
            const inputField = document.getElementById('bossInput');
            const rawInput = inputField.value.trim();
            if (!rawInput) return;

            postToScreen('BOSS EMON', rawInput, 'boss-command');
            inputField.value = '';

            const data = processLogic(rawInput);
            
            let style = 'ai-response';
            if (data.status === 'danger') style = 'critical-response';
            if (data.status === 'sad') style = 'sad-response';

            postToScreen('ROOTX_AI', data.reply, style);
            speakVoice(data.reply);
        }
    </script>
