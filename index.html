<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EMON SMART MANAGER | Cloud Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    body { background-color: #030712; color: #f3f4f6; }
    .card-glass { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(0, 242, 254, 0.25); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- লকিং ও লগইন স্ক্রিন -->
  <div id="authGate" class="fixed inset-0 bg-[#030712] z-[100] flex items-center justify-center p-4">
    <div class="card-glass p-6 rounded-3xl w-full max-w-sm border-cyan-500/40 shadow-2xl space-y-5 text-center">
      <div>
        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-slate-950 text-3xl shadow-lg shadow-cyan-500/30 mb-3">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-xl font-black tracking-wider text-cyan-400 font-orbitron">EMON<span class="text-amber-400">|MANAGER</span></h1>
        <p class="text-xs text-gray-400 mt-1">আপনার হিসাব সুরক্ষিত রাখতে জিমেইল দিয়ে প্রবেশ করুন</p>
      </div>

      <div class="grid grid-cols-2 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
        <button id="tabLoginBtn" onclick="toggleAuthMode('login')" class="py-2 rounded-lg bg-cyan-500 text-slate-950 transition">লগইন</button>
        <button id="tabSignupBtn" onclick="toggleAuthMode('signup')" class="py-2 rounded-lg text-gray-400 transition">সাইন-আপ</button>
      </div>

      <p id="authError" class="text-xs text-rose-400 font-bold hidden bg-rose-950/50 border border-rose-500/30 p-2 rounded-lg"></p>

      <div class="space-y-3 text-left text-xs">
        <div id="nameFieldWrap" class="hidden">
          <label class="text-gray-400 block mb-1 font-bold">আপনার নাম:</label>
          <input type="text" id="authName" placeholder="Emon Khan" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="text-gray-400 block mb-1 font-bold">জিমেইল:</label>
          <input type="email" id="authEmail" placeholder="example@gmail.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="text-gray-400 block mb-1 font-bold">পাসওয়ার্ড:</label>
          <input type="password" id="authPass" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-400">
        </div>
      </div>

      <button onclick="submitAuth()" id="authSubmitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg shadow-cyan-500/20">
        অ্যাপে প্রবেশ করুন <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>
  </div>

  <!-- মূল অ্যাপ কন্টেইনার -->
  <div id="mainAppContainer" class="hidden">
    <header class="max-w-4xl mx-auto p-3.5 flex justify-between items-center bg-[#090d16]/95 border-b border-cyan-500/20 sticky top-0 z-50">
      <div>
        <h1 class="text-sm sm:text-base font-black tracking-wider text-cyan-400 font-orbitron">EMON<span class="text-amber-400">|SMART MANAGER</span></h1>
        <p class="text-[10px] text-gray-400 font-semibold">স্ট্যাটাস: <span id="syncIndicator" class="text-emerald-400 font-bold">● ডেটাবেস সেভড</span></p>
      </div>
      <div class="flex items-center gap-2">
        <div class="text-right">
          <p id="loggedUserName" class="text-xs font-bold text-cyan-300"></p>
          <p id="loggedUserEmail" class="text-[10px] text-gray-400"></p>
        </div>
        <button onclick="logoutUser()" class="bg-rose-500/20 border border-rose-500/40 text-rose-400 px-2.5 py-1.5 rounded-xl text-xs font-bold" title="লগআউট">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto p-3 space-y-4">
      <div class="card-glass p-4 rounded-2xl text-center">
        <h2 class="text-base font-bold text-cyan-300">স্বাগতম! আপনার ক্লাউড ড্যাশবোর্ড সফলভাবে সক্রিয় হয়েছে।</h2>
        <p class="text-xs text-gray-400 mt-1">এখন থেকে আপনার সব হিসাব এই অ্যাকাউন্টে সুরক্ষিত থাকবে।</p>
      </div>
    </main>
  </div>

  <script>
    let authMode = 'login';
    window.onload = async function() {
      const res = await fetch('/api/session');
      const result = await res.json();
      if(result.logged_in) { unlockApp(result.name, result.email, result.data); }
    };

    function toggleAuthMode(mode) {
      authMode = mode;
      document.getElementById('authError').classList.add('hidden');
      if(mode === 'signup') {
        document.getElementById('nameFieldWrap').classList.remove('hidden');
        document.getElementById('tabSignupBtn').className = "py-2 rounded-lg bg-cyan-500 text-slate-950 transition";
        document.getElementById('tabLoginBtn').className = "py-2 rounded-lg text-gray-400 transition";
        document.getElementById('authSubmitBtn').innerHTML = 'সাইন-আপ ও প্রবেশ করুন <i class="fa-solid fa-user-plus ml-1"></i>';
      } else {
        document.getElementById('nameFieldWrap').classList.add('hidden');
        document.getElementById('tabLoginBtn').className = "py-2 rounded-lg bg-cyan-500 text-slate-950 transition";
        document.getElementById('tabSignupBtn').className = "py-2 rounded-lg text-gray-400 transition";
        document.getElementById('authSubmitBtn').innerHTML = 'অ্যাপে প্রবেশ করুন <i class="fa-solid fa-arrow-right ml-1"></i>';
      }
    }

    async function submitAuth() {
      const name = document.getElementById('authName').value;
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPass').value;
      const errBox = document.getElementById('authError');

      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: authMode, name, email, password })
      });
      const result = await res.json();

      if(result.status === 'success') {
        unlockApp(result.name, result.email, result.data);
      } else {
        errBox.innerText = result.msg;
        errBox.classList.remove('hidden');
      }
    }

    function unlockApp(name, email, cloudData) {
      document.getElementById('authGate').classList.add('hidden');
      document.getElementById('mainAppContainer').classList.remove('hidden');
      document.getElementById('loggedUserName').innerText = name;
      document.getElementById('loggedUserEmail').innerText = email;
    }

    async function logoutUser() {
      if(confirm("লগআউট করতে চান?")) {
        await fetch('/api/logout', { method: 'POST' });
        location.reload();
      }
    }
  </script>
</body>
</html>
