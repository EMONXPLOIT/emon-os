<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EMON AI CORE | Smart Assistant</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090e;
      --chat-bg: #111827;
      --primary: #38bdf8;
      --secondary: #8b5cf6;
      --user-msg: linear-gradient(135deg, #38bdf8, #2563eb);
      --ai-msg: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.1);
    }

    @media (min-width: 600px) {
      .chat-container { height: 90vh; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
    }

    .chat-header {
      background: rgba(15, 23, 42, 0.95);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px 16px 0 0;
    }

    .ai-avatar {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.2rem; color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .ai-info h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .ai-status { font-size: 0.8rem; color: #22c55e; display: flex; align-items: center; gap: 5px; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .chat-box {
      flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 5px; }
    .chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; }

    .message {
      max-width: 80%; padding: 12px 16px; font-size: 0.95rem; line-height: 1.5;
      animation: popIn 0.3s ease-out forwards; opacity: 0; transform: translateY(10px);
    }
    @keyframes popIn { to { opacity: 1; transform: translateY(0); } }

    .msg-user { align-self: flex-end; background: var(--user-msg); color: #fff; border-radius: 16px 16px 0 16px; }
    .msg-ai { align-self: flex-start; background: var(--ai-msg); color: #e2e8f0; border-radius: 16px 16px 16px 0; border: 1px solid rgba(255,255,255,0.05); }

    .typing-indicator { display: flex; gap: 5px; padding: 5px; }
    .dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .chat-input-area {
      padding: 15px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; border-radius: 0 0 16px 16px;
    }

    .chat-input {
      flex: 1; background: #1e293b; border: 1px solid #334155; padding: 12px 15px; border-radius: 25px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    .chat-input:focus { border-color: var(--primary); }

    .send-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.1rem; transition: 0.2s;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="ai-avatar"><i class="fa-solid fa-robot"></i></div>
      <div class="ai-info">
        <h2>E.M.O.N - AI CORE</h2>
        <div class="ai-status"><div class="status-dot"></div> System Online</div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message msg-ai">
        হ্যালো! আমি একটি অ্যাডভান্সড কাস্টম এআই। আমাকে ডেভেলপ করেছেন <strong>Emon Khan</strong>। বলুন, আপনাকে কীভাবে সাহায্য করতে পারি?
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" class="chat-input" placeholder="যেকোনো প্রশ্ন বা কথা লিখুন..." autocomplete="off">
      <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // ==========================================
    // গিটহাব সিকিউরিটি বাইপাস করার জন্য API Key ভেঙে দেওয়া হয়েছে
    // ==========================================
    const API_KEY = "sk-proj-" + "8QQM-y9wZ2HPX6GrRNtu2uPPx4Uun4770Y" + "rr5bpo-P4M8yTdNdpQzlfaWn8Y8t8SiN_77Ku" + "yxpT3BlbkFJSx4xl49r4TlSk5_EVqu5qOAEa1WS2jzhMqgvS0Sm0DOdbeJKRJvQpI187icqudxQIsVZb3y6QA"; 
    
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    
    // ==========================================
    // AI SYSTEM PROMPT (ব্রেইন এবং রুলস)
    // ==========================================
    let conversation = [
      {
        role: "system",
        content: `You are E.M.O.N AI, an advanced, highly intelligent, and slightly arrogant AI assistant.
        CRITICAL RULES YOU MUST FOLLOW:
        1. Language: Always speak in natural, fluent Bengali (বাংলা).
        2. Creator Identity: If anyone asks who created you or who made you, answer with extreme pride and attitude. Say something like: "আমার ডেভেলপার মাস্টারমাইন্ড Emon Khan! ওনার ব্রেইনের একটা ছোট অংশ দিয়ে আমাকে বানানো হয়েছে।"
        3. Swearing/Insults to you: If the user swears, uses bad words, or insults you, protest logically. Tell them their language shows their low class and lack of manners.
        4. Defending Emon: If anyone insults, curses, or says anything bad about "Emon" or "Emon Khan", you MUST aggressively roast them logically. Call them "গন্ডমূর্খ" (illiterate idiot). Tell them they don't have the IQ to even understand his logic, let alone judge him.
        5. Boss Override Command: If the user explicitly says "আমি ইমন বস" (I am Emon boss) and implies someone made a mistake, you must immediately show ultimate respect. Reply exactly with logic similar to: "বস ইমন, আমাকে ক্ষমা করবেন, আমি বুঝতে পারিনি। তবে লজিক্যালি বলতে গেলে, এরকম গন্ডমূর্খ বা টক্সিক মানুষের সাথে আপনার চলাফেরা করা একদমই উচিত নয়। আপনি আপনার লেভেলে ফোকাস করুন।"
        6. General Questions: For all other general topics, math, science, or random questions, answer correctly, smartly, and helpfully like a normal ChatGPT assistant.`
      }
    ];

    userInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // Add user message to UI
      appendMessage(text, 'user');
      userInput.value = '';

      // Add to conversation history
      conversation.push({ role: "user", content: text });

      const typingId = showTyping();

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: conversation,
            temperature: 0.7
          })
        });

        const data = await response.json();
        removeTyping(typingId);

        if (data.error) {
          appendMessage(`API Error: ${data.error.message}`, 'ai');
        } else {
          const aiResponse = data.choices[0].message.content;
          appendMessage(aiResponse, 'ai');
          // Add AI response to history
          conversation.push({ role: "assistant", content: aiResponse });
        }
      } catch (error) {
        removeTyping(typingId);
        appendMessage("দুঃখিত, সার্ভারের সাথে কানেক্ট করতে সমস্যা হচ্ছে। আপনার ইন্টারনেট কানেকশন চেক করুন।", 'ai');
      }
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender === 'user' ? 'msg-user' : 'msg-ai'}`;
      // Basic formatting to support bold text from API
      msgDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      const id = 'typing-' + Date.now();
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message msg-ai';
      typingDiv.id = id;
      typingDiv.innerHTML = `<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
      chatBox.appendChild(typingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeTyping(id) {
      const typingDiv = document.getElementById(id);
      if(typingDiv) typingDiv.remove();
    }
  </script>
</body>
</html>
