<!-- ================= PROFESSIONAL AUTH GATE ================= -->
  <div id="authGate" class="fixed inset-0 bg-[#030712] z-[100] flex items-center justify-center p-4 backdrop-blur-xl">
    <div class="card-glass p-6 sm:p-8 rounded-3xl w-full max-w-md border-cyan-500/30 shadow-2xl space-y-6 text-center relative overflow-hidden">
      
      <!-- Top Glow Effect -->
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Brand Logo & Header -->
      <div class="relative z-10">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-slate-950 text-2xl shadow-xl shadow-cyan-500/30 mb-3 border border-cyan-300/30">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-lg font-black tracking-wider text-cyan-400 font-orbitron">EMON<span class="text-amber-400">|MANAGER</span></h1>
        <p class="text-xs text-gray-400 mt-1">আপনার সব হিসাব সুরক্ষিত রাখতে নিরাপদ ক্লাউড পোর্টাল</p>
      </div>

      <!-- Professional Toggle Tabs -->
      <div class="relative z-10 grid grid-cols-2 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs font-bold">
        <button id="tabLoginBtn" onclick="toggleAuthMode('login')" class="py-2.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 shadow-md transition">লগইন (Login)</button>
        <button id="tabSignupBtn" onclick="toggleAuthMode('signup')" class="py-2.5 rounded-lg text-gray-400 hover:text-white transition">সাইন-আপ (Sign Up)</button>
      </div>

      <!-- Error Message Box -->
      <p id="authError" class="text-xs text-rose-400 font-bold hidden bg-rose-950/60 border border-rose-500/40 p-2.5 rounded-xl"></p>

      <!-- Form Fields -->
      <div class="relative z-10 space-y-3.5 text-left text-xs">
        <div id="nameFieldWrap" class="hidden transition-all">
          <label class="text-gray-300 block mb-1 font-semibold"><i class="fa-solid fa-user text-cyan-400 mr-1"></i> আপনার পূর্ণ নাম:</label>
          <input type="text" id="authName" placeholder="যেমন: Emon Khan" class="w-full bg-slate-950/90 border border-slate-700/80 rounded-xl p-3 text-white focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 font-medium">
        </div>
        <div>
          <label class="text-gray-300 block mb-1 font-semibold"><i class="fa-solid fa-envelope text-cyan-400 mr-1"></i> আপনার Gmail অ্যাড্রেস:</label>
          <input type="email" id="authEmail" placeholder="example@gmail.com" class="w-full bg-slate-950/90 border border-slate-700/80 rounded-xl p-3 text-white focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 font-medium">
        </div>
        <div>
          <label class="text-gray-300 block mb-1 font-semibold"><i class="fa-solid fa-lock text-cyan-400 mr-1"></i> পাসওয়ার্ড (Password):</label>
          <input type="password" id="authPass" placeholder="••••••••" class="w-full bg-slate-950/90 border border-slate-700/80 rounded-xl p-3 text-white focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 font-medium">
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="submitAuth()" id="authSubmitBtn" class="relative z-10 w-full bg-gradient-to-r from-cyan-400 via-cyan-500 to-blue-600 hover:from-cyan-300 hover:to-blue-500 text-slate-950 font-black py-3.5 rounded-xl text-xs sm:text-sm shadow-lg shadow-cyan-500/25 transition transform active:scale-95">
        অ্যাকাউন্টে প্রবেশ করুন <i class="fa-solid fa-arrow-right ml-1.5"></i>
      </button>

      <!-- Divider for Social/Alternative Options -->
      <div class="relative z-10 flex items-center gap-3 my-2">
        <div class="flex-1 h-px bg-slate-800"></div>
        <span class="text-[10px] text-gray-500 uppercase tracking-widest font-semibold">অথবা সুরক্ষিত ক্লাউড সিঙ্ক</span>
        <div class="flex-1 h-px bg-slate-800"></div>
      </div>

      <!-- Professional Google / Quick Info Option -->
      <div class="relative z-10 bg-slate-950/50 border border-slate-800/80 p-3 rounded-2xl flex items-center justify-center gap-2 text-gray-400 text-xs font-medium">
        <i class="fa-brands fa-google text-rose-500 text-base"></i>
        <span>Google Gmail Database Sync Active</span>
      </div>

      <!-- Footer Help Text -->
      <p class="relative z-10 text-[11px] text-gray-500 leading-relaxed border-t border-slate-800/60 pt-3">
        <i class="fa-solid fa-cloud-arrow-up text-emerald-400 mr-1"></i> ফোন হারিয়ে গেলেও যেকোনো ব্রাউজার থেকে এই জিমেইল দিয়ে লগইন করলেই সমস্ত হিসাব ফিরে পাবেন।
      </p>

    </div>
  </div>
