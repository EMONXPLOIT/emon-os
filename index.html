<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Rule Breaker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Screens -->
        <div id="start-screen" class="screen">
            <h1>The Rule Breaker</h1>
            <p>Alter gravity and reverse obstacles to reach the goal.</p>
            <p>Controls: WASD / Arrows to move. On-screen buttons to break the rules!</p>
            <button id="start-btn">Start Game</button>
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p>You broke too many rules... or not enough.</p>
            <button id="restart-btn">Try Again</button>
        </div>
        
        <div id="win-screen" class="screen hidden">
            <h1>You Win!</h1>
            <p>Rule Breaker extraordinary!</p>
            <button id="play-again-btn">Play Again</button>
        </div>

        <!-- On-screen controls -->
        <div id="controls" class="hidden">
            <button id="btn-gravity" class="control-btn">Flip Gravity</button>
            <button id="btn-reverse" class="control-btn">Reverse Obstacles</button>
            
            <div id="dpad">
                <button id="btn-left" class="dpad-btn">&larr;</button>
                <button id="btn-jump" class="dpad-btn">Jump</button>
                <button id="btn-right" class="dpad-btn">&rarr;</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
